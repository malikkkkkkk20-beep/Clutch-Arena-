<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Clutch Arena Admin</title>
<style>
:root{--bg:#0e1320;--surface:#161c2d;--surface2:#1d2438;--line:#2a3350;--fg:#e8ecf6;--muted:#98a2bd;--accent:#ff7a2f;--good:#46d39a;--hot:#ff5d73;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:1.4rem;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
input,button{font:inherit;color:inherit}
input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:6px}
label{display:block;margin-top:12px;color:var(--muted);font-size:.9rem}
.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:600;cursor:pointer;background:var(--accent);color:#1a0d03}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.good{background:var(--good);color:#04201a}
.btn.bad{background:var(--hot);color:#2a0710}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.msg{margin-top:10px;color:var(--hot);min-height:1.2em}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.muted{color:var(--muted);font-size:.9rem}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600;border:1px solid var(--line);margin-right:6px}
.pill.paid,.pill.verified{color:var(--good);border-color:var(--good)}
.pill.submitted{color:var(--accent);border-color:var(--accent)}
.pill.rejected,.pill.refunded{color:var(--hot);border-color:var(--hot)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0}
.grid dt{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.grid dd{margin:2px 0 0;font-weight:600;word-break:break-word}
.imgs{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.imgs figure{margin:0;flex:1 1 200px}
.imgs img{width:100%;max-height:320px;object-fit:contain;background:#000;border-radius:8px;border:1px solid var(--line)}
.imgs figcaption{font-size:.8rem;color:var(--muted);margin-bottom:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Clutch Arena Admin</h1>
    <button class="btn ghost" id="logout" hidden>Log out</button>
  </div>

  <form class="box" id="loginForm">
    <strong>Admin login</strong>
    <label for="ph">Mobile number</label>
    <input id="ph" inputmode="numeric" maxlength="10" autocomplete="username">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <div class="msg" id="loginMsg" role="alert"></div>
    <button class="btn" type="submit">Log in</button>
  </form>

  <div id="panel" hidden>
    <div class="tabs" id="tabs"></div>
    <div id="list"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function () {
  var SB_URL = "https://bndmjqidmnbyvoklnfft.supabase.co";
  var SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJuZG1qcWlkbW5ieXZva2xuZmZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzOTU2MTEsImV4cCI6MjEwNzk3MTYxMX0._O5VKSRSrIoGiZ5ekDM6NBmSL9dlTp3VAqA4mtRUZjk";
  var sb = window.supabase.createClient(SB_URL, SB_KEY);
  var $ = function (id) { return document.getElementById(id); };
  var rows = [], filter = "submitted", urls = {};

  function esc(v) { return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fakeEmail(ph) { return ph + "@clutcharena.in"; }
  function when(t) { return t ? new Date(t).toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" }) : "-"; }

  function showLogin(msg) {
    $("loginForm").hidden = false; $("panel").hidden = true; $("logout").hidden = true;
    $("loginMsg").textContent = msg || "";
  }

  function load() {
    sb.rpc("admin_list_registrations").then(function (r) {
      if (r.error) {
        if (/not admin/i.test(r.error.message)) { sb.auth.signOut(); return showLogin("This account is not an admin."); }
        return showLogin(r.error.message);
      }
      rows = r.data || [];
      $("loginForm").hidden = true; $("panel").hidden = false; $("logout").hidden = false;
      renderTabs(); renderList();
    });
  }

  function renderTabs() {
    var tabs = [["submitted", "Needs check"], ["pending", "Not paid"], ["paid", "Paid"], ["refunded", "Refunded"], ["all", "All"]];
    $("tabs").innerHTML = tabs.map(function (t) {
      var n = t[0] === "all" ? rows.length : rows.filter(function (x) { return x.payment_status === t[0]; }).length;
      return '<button class="tab" data-f="' + t[0] + '" aria-pressed="' + (filter === t[0]) + '">' + t[1] + " (" + n + ")</button>";
    }).join("");
  }

  function signed(path, el) {
    if (!path) return;
    var bucket = el.getAttribute("data-b");
    sb.storage.from(bucket).createSignedUrl(path, 300).then(function (r) {
      if (r.data && r.data.signedUrl) el.src = r.data.signedUrl; else el.alt = "Could not load";
    });
  }

  function renderList() {
    var list = rows.filter(function (x) { return filter === "all" || x.payment_status === filter; });
    if (!list.length) { $("list").innerHTML = '<p class="muted">Nothing here.</p>'; return; }
    $("list").innerHTML = list.map(function (x) {
      var mates = (x.mates || []).map(esc).join(", ") || "-";
      return '<article class="box" data-id="' + x.id + '">' +
        '<div class="row"><div><strong>' + esc(x.team) + '</strong> <span class="muted">· ' + esc(x.tournament) + '</span></div>' +
        '<div><span class="pill ' + esc(x.payment_status) + '">pay: ' + esc(x.payment_status) + '</span><span class="pill ' + esc(x.uid_status) + '">uid: ' + esc(x.uid_status) + '</span></div></div>' +
        '<dl class="grid">' +
        '<div><dt>Captain</dt><dd>' + esc(x.captain) + '</dd></div>' +
        '<div><dt>Game UID</dt><dd>' + esc(x.uid) + '</dd></div>' +
        '<div><dt>WhatsApp</dt><dd><a style="color:var(--accent)" href="https://wa.me/91' + esc(x.phone) + '">' + esc(x.phone) + '</a></dd></div>' +
        '<div><dt>Fee</dt><dd>₹' + esc(x.fee) + '</dd></div>' +
        '<div><dt>UTR</dt><dd>' + esc(x.utr || "-") + '</dd></div>' +
        '<div><dt>Teammate UIDs</dt><dd>' + mates + '</dd></div>' +
        '<div><dt>Booked</dt><dd>' + when(x.created_at) + '</dd></div>' +
        '<div><dt>Receipt sent</dt><dd>' + when(x.receipt_at) + '</dd></div></dl>' +
        '<div class="imgs">' +
        (x.receipt_path ? '<figure><figcaption>Payment receipt</figcaption><img data-b="receipts" data-p="' + esc(x.receipt_path) + '" alt="Receipt"></figure>' : '') +
        (x.profile_path ? '<figure><figcaption>Game profile</figcaption><img data-b="profiles" data-p="' + esc(x.profile_path) + '" alt="Profile"></figure>' : '') +
        '</div>' +
        '<div class="actions">' +
        '<button class="btn good" data-a="paid">Mark paid</button>' +
        '<button class="btn bad" data-a="refunded">Refund</button>' +
        '<button class="btn good" data-a="verified">UID verified</button>' +
        '<button class="btn bad" data-a="rejected">UID rejected</button>' +
        '</div></article>';
    }).join("");
    Array.prototype.forEach.call($("list").querySelectorAll("img[data-p]"), function (im) { signed(im.getAttribute("data-p"), im); });
  }

  $("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-f]"); if (!b) return;
    filter = b.getAttribute("data-f"); renderTabs(); renderList();
  });

  $("list").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-a]"); if (!b) return;
    var card = b.closest("article"), id = Number(card.getAttribute("data-id")), a = b.getAttribute("data-a");
    var pay = (a === "paid" || a === "refunded") ? a : null, uid = (a === "verified" || a === "rejected") ? a : null;
    if (a === "refunded" && !confirm("Mark this registration as refunded?")) return;
    b.disabled = true;
    sb.rpc("admin_set_status", { p_reg: id, p_payment: pay, p_uid_status: uid }).then(function (r) {
      if (r.error) { b.disabled = false; return alert("Failed: " + r.error.message); }
      var row = rows.filter(function (x) { return x.id === id; })[0];
      if (row) { if (pay) row.payment_status = pay; if (uid) row.uid_status = uid; }
      renderTabs(); renderList();
    });
  });

  $("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var ph = $("ph").value.trim(), pw = $("pw").value;
    if (!/^[6-9][0-9]{9}$/.test(ph)) return ($("loginMsg").textContent = "Enter a valid 10-digit number.");
    $("loginMsg").textContent = "";
    sb.auth.signInWithPassword({ email: fakeEmail(ph), password: pw }).then(function (r) {
      if (r.error) return ($("loginMsg").textContent = "Incorrect number or password.");
      $("pw").value = ""; load();
    });
  });

  $("logout").addEventListener("click", function () { sb.auth.signOut().then(function () { rows = []; showLogin(""); }); });

  sb.auth.getSession().then(function (r) { if (r.data && r.data.session) load(); });
})();
</script>
</body>
</html>
